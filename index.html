<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🎂 Happy Birthday 🎉</title>

  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Baloo+2:wght@500;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- POPUP ENTRY -->
<div class="popup" id="popup">
  <div class="popup-box bounce">
    <h1>🎉 Surprise 🎉</h1>
    <p>Tap to enter the celebration 💖</p>
    <button onclick="enterSite()">Enter 🎂</button>
  </div>
</div>

<!-- AUDIO -->
<audio id="bgMusic" loop>
  <source src="music.mpeg" type="audio/mpeg">
</audio>

<audio id="popSound">
  <source src="pop.mp3" type="audio/mpeg">
</audio>

<!-- BACKGROUND EFFECTS -->
<div class="pop-area" id="popArea"></div>

<!-- MAIN -->
<div class="container hidden" id="main">
  <h1 class="pulse">🎂 Happy Birthday Balaji Rajan...🎂</h1>
  <h2 class="float">💖 Keep shinning everyday, Always be Happy💖</h2>

  <div class="photos">
    <img src="photo1.jpg">
    <img src="photo2.jpg">
  </div>

  <p class="wish glow">
    🎉 May your life sparkle with joy, love, cake 🍰  
    and endless smiles..... ✨
  </p>

  <div class="emojis">
     🎁 💖 🌸🎂🥰😍😘
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
